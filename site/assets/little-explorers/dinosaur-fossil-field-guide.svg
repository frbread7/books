<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">A fossil shape for a field guide</title>
  <desc id="desc">A pale fossil imprint rests in a warm sandstone slab beside a small field notebook and a penciled outline, inviting careful observation.</desc>
  <rect width="360" height="240" rx="24" fill="#f7edda"/>
  <circle cx="54" cy="52" r="20" fill="#f3c86b" opacity=".8"/>
  <path d="M0 174c65-25 121-18 174-3 55 15 111 14 186-9v78H0z" fill="#e9d4b1"/>
  <path d="M71 79c25-25 85-34 130-21 38 11 62 38 68 74 6 37-16 68-53 78-54 14-120-6-147-34-29-30-28-69 2-97z" fill="#d5a66d" stroke="#80674f" stroke-width="3"/>
  <path d="M97 98c15-15 47-21 70-13 23 8 34 27 34 48 0 24-17 40-40 45-27 5-57-5-70-22-15-19-12-42 6-58z" fill="#eed9b7" stroke="#b88455" stroke-width="2"/>
  <path d="M112 125c14-12 34-16 49-10 10 4 16 13 16 23 0 13-9 22-23 25-16 4-34-2-43-11-8-8-8-19 1-27z" fill="none" stroke="#b88455" stroke-width="3" stroke-linecap="round"/>
  <path d="M118 124l-4-10m14 7-1-13m14 12 3-12m13 20 9-8m-54 28-10 4m29 9-1 10m22-15 8 7" fill="none" stroke="#b88455" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Notebook records an observation without naming an animal or claiming certainty. -->
  <g transform="rotate(-7 268 145)">
    <rect x="235" y="99" width="85" height="103" rx="7" fill="#fff9ed" stroke="#53695e" stroke-width="3"/>
    <path d="M250 99v103" stroke="#c87957" stroke-width="3"/>
    <path d="M260 120h43m-43 14h33m-33 14h39" stroke="#a8b6a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M267 171c9-10 21-10 28 0-6 9-20 11-28 0z" fill="none" stroke="#71877a" stroke-width="2.5"/>
    <circle cx="281" cy="171" r="3" fill="#e4ae4e"/>
  </g>
  <path d="M197 61c8-9 16-13 25-15" fill="none" stroke="#71877a" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <path d="M211 47l10-2-4 9" fill="none" stroke="#71877a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 214h287" stroke="#d1b994" stroke-width="2" stroke-linecap="round"/>
</svg>
