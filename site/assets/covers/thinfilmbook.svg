<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">ThinFilmBook</title>
  <desc id="cover-description">Original illustration of a thin-film stack above a substrate, with a growing material front and lattice pattern.</desc>
  <defs>
    <linearGradient id="substrate" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#274c59"/><stop offset="1" stop-color="#162b36"/></linearGradient>
    <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#f5b186"/><path d="M3 3h26M3 3v26" stroke="#8da9a7" stroke-width=".7" opacity=".48"/></pattern>
  </defs>
  <rect width="640" height="820" fill="#f4f1e8"/>
  <path d="M0 0h640v330H0z" fill="#172d38"/>
  <circle cx="517" cy="130" r="168" fill="#284957"/>
  <circle cx="517" cy="130" r="119" fill="none" stroke="#8ea9a5" stroke-width="1.5" opacity=".55"/>
  <circle cx="517" cy="130" r="84" fill="none" stroke="#8ea9a5" stroke-width="1" opacity=".4"/>
  <g transform="translate(66 390)">
    <rect width="508" height="238" rx="8" fill="url(#substrate)"/>
    <rect x="0" y="-58" width="508" height="56" fill="#c35e3c"/>
    <rect x="0" y="-91" width="508" height="29" fill="#4e8f93"/>
    <rect x="0" y="-118" width="508" height="23" fill="#dfaa68"/>
    <path d="M25 -117h463M25 -89h463M25 -55h463" stroke="#f5e4bf" stroke-width="2" opacity=".7"/>
    <path d="M0 0h508v238H0z" fill="url(#lattice)" opacity=".55"/>
    <path d="M0 -120v-26M508 -120v-26M0 -136h508" fill="none" stroke="#284957" stroke-width="1.5"/>
  </g>
  <text x="70" y="100" fill="#f2ac84" font-family="ui-monospace,monospace" font-size="17" letter-spacing="3">GROWTH · INTERFACES · STRESS</text>
  <text x="66" y="710" fill="#172d38" font-family="Georgia,serif" font-size="54" font-weight="bold">ThinFilmBook</text>
