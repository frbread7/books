name: Validate and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://frbread7.github.io/books/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Smoke-test deployed portal
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import os
          import time
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen

          base = os.environ["PAGES_URL"].rstrip("/") + "/"
          parsed = urlparse(base)
          if parsed.scheme != "https" or parsed.netloc != "frbread7.github.io" or parsed.path != "/books/":
              raise SystemExit(f"Unexpected Pages deployment URL: {base}")
          integration_site = "https://frbread7.github.io/processintegrationbook/"
          paths = [
              "",
              "data/books.json",
              "book.html?slug=watbook",
              "book.html?slug=processintegrationbook",
              "learning-journey.html",
              "data/learning-journey.json",
              "data/roadmap.json",
              "css/style.css",
              "js/app.js",
              "assets/covers/watbook.svg",
              "assets/covers/processintegrationbook.svg",
              integration_site,
              integration_site + "ko/",
              integration_site + "chapters/c01-integration-as-decision.html",
              integration_site + "ko/chapters/c01-integration-as-decision.html",
          ]

          def fetch(path):
              url = urljoin(base, path)
              try:
                  with urlopen(url, timeout=6) as response:
                      body = response.read(2_000_001)
                      return url, response.status, response.geturl(), body, None
              except Exception as exc:
                  return url, None, None, b"", f"{type(exc).__name__}: {exc}"

          last_errors = []
          for attempt in range(1, 13):
              with ThreadPoolExecutor(max_workers=len(paths)) as pool:
                  results = list(pool.map(fetch, paths))
              last_errors = []
              for url, status, final_url, body, error in results:
                  allowed_root = base if url.startswith(base) else integration_site if url.startswith(integration_site) else None
                  if error:
                      last_errors.append(f"{url}: {error}")
                  elif status != 200 or not body:
                      last_errors.append(f"{url}: status={status}, bytes={len(body)}")
                  elif allowed_root is None or not final_url.startswith(allowed_root):
                      last_errors.append(f"{url}: redirected outside its expected site to {final_url}")
                  elif url.endswith("data/books.json"):
                      try:
                          books = json.loads(body)
                      except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                          last_errors.append(f"{url}: invalid JSON: {exc}")
                      else:
                          if not any(book.get("id") == "watbook" and book.get("status") == "published" for book in books):
                              last_errors.append(f"{url}: published WATBook record missing")
                          integration = next((book for book in books if book.get("id") == "processintegrationbook"), None)
                          if integration is None or integration.get("status") != "published":
                              last_errors.append(f"{url}: published ProcessIntegrationBook record missing")
                          else:
                              language_urls = integration.get("languageUrls", {})
                              if language_urls.get("en") != integration_site or language_urls.get("ko") != integration_site + "ko/":
                                  last_errors.append(f"{url}: ProcessIntegrationBook language entry URLs are missing or incorrect")
                              chapter = next((item for item in integration.get("chapters", []) if item.get("id") == "c01-integration-as-decision"), None)
                              if chapter is None or chapter.get("urls", {}).get("en") != integration_site + "chapters/c01-integration-as-decision.html" or chapter.get("urls", {}).get("ko") != integration_site + "ko/chapters/c01-integration-as-decision.html":
                                  last_errors.append(f"{url}: ProcessIntegrationBook chapter URLs are missing or incorrect")
                  elif url.endswith("data/learning-journey.json"):
                      try:
                          journey = json.loads(body)
                      except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                          last_errors.append(f"{url}: invalid JSON: {exc}")
                      else:
                          if (len(journey.get("stages", [])), len(journey.get("strands", [])), len(journey.get("concepts", []))) != (6, 11, 66):
                              last_errors.append(f"{url}: expected 6 stages, 11 strands, and 66 concepts")
                  elif url.endswith("data/roadmap.json"):
                      try:
                          roadmap = json.loads(body)
                      except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                          last_errors.append(f"{url}: invalid JSON: {exc}")
                      else:
                          math_books = roadmap.get("mathematicsBooks", [])
                          if len(math_books) != 7 or any(item.get("status") != "planned" for item in math_books):
                              last_errors.append(f"{url}: expected seven planned mathematics proposals")
                  elif url.endswith(("assets/covers/watbook.svg", "assets/covers/processintegrationbook.svg")) and b"<svg" not in body[:512]:
                      last_errors.append(f"{url}: book cover is not SVG content")
              if not last_errors:
                  print(f"Pages smoke passed on attempt {attempt}: {len(paths)} routes/assets at {base}")
                  break
              if attempt < 12:
                  time.sleep(5)
          else:
              raise SystemExit("Pages smoke failed after retries:\n" + "\n".join(last_errors))
          PY
